# T4 (registered: decisions.md [REG] T4 (step budget)): the cache-off (E1's sweep_l1pl350cl_pc_off.yaml) sweep of setup L1 at 350 W with
# closed-loop turns, seed 0, 900 s per rate, at --max-num-batched-tokens 8192 (the only difference from its 2048 twin).
# Both T4 arms pin the KV pool at the 96,656 tokens every default-pool run logged (6041 blocks of 16), so the
# step budget is the only difference between the arms and checks.expected_kv_tokens stays valid; the profiled
# block count is still logged ('Overriding num_gpu_blocks=X'). Needs the author's approval to run.
extends: sweep_l1pl350cl_pc_off.yaml
name: sweep_t4_l1pl350cl_pc_off_b8192
server:
  args:
    --num-gpu-blocks-override: 6041
    --max-num-batched-tokens: 8192
sweep:
  rates: [1.5, 2, 2.5, 3, 3.5, 4]
